[project]
name = "catt-mcp"
version = "0.1.0"
description = "MCP server for casting YouTube/media to Chromecast/DLNA via catt"
readme = "README.md"
authors = [{ name = "amineutron", email = "amine.neutroncore@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.5,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
cache = ["lz4>=4.0.0"]

[project.urls]
Homepage = "https://github.com/amineutron/catt-mcp"
Repository = "https://github.com/amineutron/catt-mcp"
Issues = "https://github.com/amineutron/catt-mcp/issues"

[project.scripts]
catt-mcp = "server:cli"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "sync_watcher.py"]

[tool.hatch.build.targets.sdist]
include = ["server.py", "README.md", "LICENSE", "config.example.yaml", "tests/", "sync_watcher.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
